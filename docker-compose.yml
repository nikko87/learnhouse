version: "3.9"

services:
  app:
    build: .
    # Remover mapeamento da porta 80 - Traefik vai gerenciar
    expose:
      - "80"
    volumes:
      - .:/usr/learnhouse
    env_file:
      - ./extra/example-learnhouse-conf.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  db:
    image: postgres:16-alpine
    restart: always
    # Remover mapeamento externo de portas
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=learnhouse
      - POSTGRES_PASSWORD=learnhouse
      - POSTGRES_DB=learnhouse
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnhouse"]
      interval: 5s
      timeout: 4s
      retries: 5


  redis:
    image: redis:7.2.3
    restart: always
    # Remover mapeamento externo de portas
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5


  chromadb:
    image: chromadb/chroma:0.5.16
    # Remover mapeamento externo de portas
    expose:
      - "8000"
    volumes:
      - chroma-data:/chroma/chroma

volumes:
  db-data:
  redis-data:
  chroma-data:
